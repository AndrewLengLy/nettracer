        <h1 style="font-size: 26px; font-weight: 500">NetTracer</h1>
        <p>NetTracer is an interactive network lab. It shows ARP, switching, routing, DNS, TCP and HTTP moving frame by frame across a 3D network, and why each header changes along the way. It also scores the network and offers one-click fixes such as VLANs and HSRP.</p>
        <p>The lab runs in the browser and needs JavaScript turned on.</p>
